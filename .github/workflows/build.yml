name: Windows EXE
on: [push, workflow_dispatch]
permissions:
  contents: read
  security-events: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
      - shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $b = New-Object Drawing.Bitmap 256,256
          $g = [Drawing.Graphics]::FromImage($b)
          $g.SmoothingMode = 'AntiAlias'
          $g.FillEllipse([Drawing.Brushes]::DarkSlateBlue,8,8,240,240)
          $g.DrawEllipse((New-Object Drawing.Pen ([Drawing.Color]::MediumPurple),6),8,8,240,240)
          $p = New-Object Drawing.Pen ([Drawing.Color]::White),8
          $g.DrawRectangle($p,65,95,126,78)
          $g.DrawEllipse($p,103,109,50,50)
          $icon = [Drawing.Icon]::FromHandle($b.GetHicon())
          $s = [IO.File]::Create("$pwd\icon.ico")
          $icon.Save($s)
          $s.Close()
          $g.Dispose()
          $b.Dispose()
          New-Item -ItemType Directory -Force dist
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:x64 /win32icon:icon.ico /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /out:dist/LE679-OneClick-Screenshot-V1.exe Capture.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: github/codeql-action/analyze@v3
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Get-MpComputerStatus).AntivirusEnabled) { throw 'Defender unavailable' }
          Start-MpScan -ScanType CustomScan -ScanPath "$pwd\dist"
          if (!(Test-Path dist/LE679-OneClick-Screenshot-V1.exe)) { throw 'EXE missing after scan' }
          Get-FileHash dist/LE679-OneClick-Screenshot-V1.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LE679-OneClick-Screenshot-V1
          path: dist/LE679-OneClick-Screenshot-V1.exe
