name: Windows EXE
on: [push, workflow_dispatch]
permissions:
  contents: read
  security-events: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $bitmap = [Drawing.Bitmap]::FromFile("$pwd\\icon.png")
          try {
            $handle = $bitmap.GetHicon()
            try {
              $icon = [Drawing.Icon]::FromHandle($handle)
              $stream = [IO.File]::Create("$pwd\\icon.ico")
              try { $icon.Save($stream) } finally { $stream.Dispose(); $icon.Dispose() }
            } finally { Add-Type -TypeDefinition '[System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool DestroyIcon(System.IntPtr handle);' -Name NativeIcon -Namespace LE679; [LE679.NativeIcon]::DestroyIcon($handle) | Out-Null }
          } finally { $bitmap.Dispose() }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item icon.png dist/icon.png
          & "$env:WINDIR\\Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe" /nologo /target:winexe /platform:x64 /win32icon:icon.ico /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /out:dist/LE679-OneClick-Screenshot-V1.exe Capture.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: github/codeql-action/analyze@v3
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Get-MpComputerStatus).AntivirusEnabled) { throw 'Defender unavailable' }
          Start-MpScan -ScanType CustomScan -ScanPath "$pwd\dist"
          if (!(Test-Path dist/LE679-OneClick-Screenshot-V1.exe)) { throw 'EXE missing after scan' }
          Get-FileHash dist/LE679-OneClick-Screenshot-V1.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LE679-OneClick-Screenshot-V1
          path: |
            dist/LE679-OneClick-Screenshot-V1.exe
            dist/icon.png
